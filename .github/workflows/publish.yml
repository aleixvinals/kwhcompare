name: Publish article

on:
  schedule:
    - cron: "0 13 * * 2"   # Tuesdays, 13:00 UTC (8 AM Texas time)
  workflow_dispatch: {}     # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency: publish-article

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write the next article
        id: article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          PR_BODY_FILE: ${{ runner.temp }}/preview.md
        run: python3 scripts/write_article.py

      - name: Check the site builds
        run: python3 build.py

      - name: Publish to the site
        env:
          TITLE: ${{ steps.article.outputs.title }}
        run: |
          git config user.name "kwhcompare-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/
          git commit -m "New article: $TITLE"
          git push
